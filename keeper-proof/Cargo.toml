[package]
name = "wrfcoin-keeper-proof"
version = "0.1.0"
edition = "2021"
description = "Keeper storage attestation, retrieval proof, and health monitoring types for WRFCoin"
license = "MIT OR Apache-2.0"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wrf-primitives.workspace = true
wrfcoin-dataset-manifest = { path = "../dataset-manifest" }
wrfcoin-shared-protocol = { path = "../shared-protocol" }

[features]
# Off-chain retrieval audits for storage keepers (#3564). Default off: nothing
# on chain reads these types; see docs/adr/2026-10-28-3564-storage-keepers.md.
retrieval-audit = []

[dev-dependencies]
rand.workspace = true
