# Prometheus configuration for mock service monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'test'
    project: 'wrfcoin'

rule_files:
  - 'alert_rules.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Health Checker Service
  - job_name: 'health-checker'
    static_configs:
      - targets: ['health-checker:3100']
    scrape_interval: 10s
    metrics_path: '/metrics'
    scrape_timeout: 5s

  # Weather Oracle Mock
  - job_name: 'weather-mock'
    static_configs:
      - targets: ['weather-mock:3010']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Blockchain RPC Mock
  - job_name: 'blockchain-mock'
    static_configs:
      - targets: ['blockchain-mock:8545']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Carbon Oracle Mock
  - job_name: 'carbon-mock'
    static_configs:
      - targets: ['carbon-mock:3020']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Docker metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # MockServer metrics (if available)
  - job_name: 'mockserver'
    static_configs:
      - targets: ['mockserver:1080']
    scrape_interval: 30s
    metrics_path: '/mockserver/metrics'
    scrape_timeout: 5s
    honor_labels: true

  # RabbitMQ metrics
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Consul metrics
  - job_name: 'consul'
    static_configs:
      - targets: ['consul:8500']
    scrape_interval: 30s
    metrics_path: '/v1/agent/metrics'
    params:
      format: ['prometheus']

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Elasticsearch metrics (if exporter available)
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']
    scrape_interval: 60s
    metrics_path: '/metrics'
    scrape_timeout: 30s

# Remote write configuration for long-term storage (optional)
# remote_write:
#   - url: "https://your-remote-storage/api/v1/write"
#     basic_auth:
#       username: "user"
#       password: "password"

# Storage configuration
storage:
  tsdb:
    retention.time: 7d
    retention.size: 1GB
    path: /prometheus/data

# Web configuration
web:
  console.libraries: /etc/prometheus/console_libraries
  console.templates: /etc/prometheus/consoles
  enable-lifecycle: true
  enable-admin-api: true
