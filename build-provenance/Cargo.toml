[package]
name = "wrfcoin-build-provenance"
version.workspace = true
edition = "2021"
description = "Build-time commit/dirty/timestamp provenance embedded into wrfcoin binaries (#2721)"
build = "build.rs"

# Deliberately dependency-free, build-dependencies included. This crate sits in
# front of the CLI and of shared-protocol's example targets, so anything it
# pulls in is paid for on every cold build of those; the build script shells out
# to `git` and formats its own timestamp rather than take `chrono` for it.
[dependencies]
