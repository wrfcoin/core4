[package]
name = "wrfcoin-shared-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wrfcoin-shared-protocol = { path = ".." }
serde_json = "1.0"

[[bin]]
name = "fuzz_validate_physics"
path = "fuzz_targets/fuzz_validate_physics.rs"
doc = false

[[bin]]
name = "fuzz_weather_observation"
path = "fuzz_targets/fuzz_weather_observation.rs"
doc = false
