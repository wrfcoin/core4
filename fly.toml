# WRFCoin Fly.io Configuration for PR Preview Environments
app = "wrfcoin-${FLY_PR_NUMBER:-main}"
primary_region = "ord"

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/paketo-buildpacks/nodejs"]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"

[experimental]
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "1s"

[[services.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "get"
  path = "/api/health"
  protocol = "http"

[deploy]
  strategy = "canary"

# PR Preview Environment Settings
[pr_environments]
  enabled = true
  auto_cleanup = true
  cleanup_after_days = 7
  
  # Resource limits for preview environments
  [pr_environments.resources]
    cpu_kind = "shared"
    cpus = 1
    memory_mb = 512

# Production settings (only used for main branch)
[production]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  max_machines_running = 10

  [production.resources]
    cpu_kind = "performance"
    cpus = 2
    memory_mb = 2048

# Database configuration
[[statics]]
  guest_path = "/app/public"
  url_prefix = "/static/"

[metrics]
  port = 9091
  path = "/metrics"

# Health checks
[[checks]]
  name = "api_health"
  type = "http"
  interval = "30s"
  timeout = "5s"
  path = "/api/health"

[[checks]]
  name = "database_connection"
  type = "http"
  interval = "60s"
  timeout = "10s"
  path = "/api/health/database"