\* Validator-set model at |V| = 2 — story #2099.
\*
\* Small sizes are run explicitly because that is where integer quorum
\* rounding diverges most from the "two thirds" intuition. The model still
\* reaches every subset of this universe, including the empty set.

SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2}
    MaxEpoch = 3
    MaxPower = 2
    EnforceVoteEpoch = TRUE
    GadgetTracksSet = TRUE

INVARIANTS
    TypeOK
    QuorumThresholdSound
    EmptySetCannotFinalize
    NoStaleVoteCounted
    OnlyMembersContributeWeight
    FinalizedOnlyByRealSupermajority
    PendingSetIsNotAuthoritative
