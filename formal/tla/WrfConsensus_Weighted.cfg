\* NON-UNIFORM STAKE (story #2098, #2255 review).
\*
\* The canonical WrfConsensus.cfg holds stake uniform, which makes every result
\* validator-COUNT arithmetic. The Rust is stake-weighted: bft_finality sums
\* FinalityValidator.stake_weight and applies `accumulated * 3 > total * 2` to
\* those sums. A result proved under uniform weights does not by itself
\* transfer to the implementation.
\*
\* Same four validators and same single Byzantine validator as the canonical
\* run, but stake is skewed onto an HONEST validator:
\*
\*     v1 = 5 (heavy, honest);  v2 = v3 = v4 = 1;  total = 8
\*     Byzantine = {v4}, Byzantine weight = 1;  1 * 3 = 3 < 8, bound holds.
\*
\* Total 8 is deliberately not a multiple of 3, so the `\div 3` in
\* RequiredWeight truncates and RequiredWeightMatchesSupermajority genuinely
\* checks the two Rust threshold forms agreeing rather than an arithmetic
\* coincidence.
\*
\* Expected: NO error — the weighted counterpart of the canonical run.

SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2, v3, v4}
    ByzantineValidators = {v4}
    Nodes = {n1, n2}
    Blocks = {ba, bb}
    MaxHeight = 3

    HeavyValidators = {v1}
    HeavyStake = 5
    LightStake = 1

INVARIANTS
    TypeOK
    NoConflictingFinalization
    QuorumIntersection
    RequiredWeightMatchesSupermajority
    ByzantineWeightWithinBound
    FinalizedBlocksAreKnownBlocks
