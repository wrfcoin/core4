\* Validator-set model with EnforceVoteEpoch = FALSE — story #2099.
\*
\* THIS CONFIGURATION IS EXPECTED TO FAIL. Do not "fix" it by weakening
\* NoStaleVoteCounted.
\*
\* It models `FinalityVote` as it exists today: `block_hash`, `block_height`,
\* `validator_id`, and a signature over exactly those three. No epoch, no
\* validator-set identity, and `content_hash` binds neither. A vote cast under
\* one validator set is byte-identical to the same vote replayed under the
\* next one, so nothing can refuse it.
\*
\* Expected: "Error: Invariant NoStaleVoteCounted is violated."
\*
\* The fix is in the Rust, not in this model: bind an epoch or validator-set
\* identifier into FinalityVote and into the signed preimage. See the issue
\* referenced in formal/tla/ValidatorSet.README.md.

SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2, v3}
    MaxEpoch = 3
    MaxPower = 1
    EnforceVoteEpoch = FALSE
    GadgetTracksSet = TRUE

INVARIANTS
    TypeOK
    QuorumThresholdSound
    NoStaleVoteCounted
    FinalizedOnlyByRealSupermajority
    PendingSetIsNotAuthoritative
