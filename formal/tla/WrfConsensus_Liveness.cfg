\* Liveness configuration for WrfConsensus — story #2098.
\*
\* Checked separately from safety because liveness needs fairness constraints
\* (FairSpec) and is far more expensive to check.
\*
\* See formal/README.md — this configuration documents a genuine limit of the
\* model, not a protocol defect.

SPECIFICATION LiveSpec

CONSTANTS
    Validators = {v1, v2, v3, v4}
    ByzantineValidators = {v4}
    Nodes = {n1, n2}
    Blocks = {ba, bb}
    MaxHeight = 1
    \* Uniform stake: identical meaning to the pre-#2255 `Weight(v) == 1`.
    HeavyValidators = {}
    HeavyStake = 1
    LightStake = 1
PROPERTY
    EventuallyFinalizes
