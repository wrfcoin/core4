\* TLC configuration for WrfConsensus — story #2098.
\*
\* The canonical safety configuration: n = 4, f = 1, the smallest set where
\* a 2/3+ threshold is supposed to tolerate one Byzantine validator.
\*
\* Two observing nodes is exactly what NoConflictingFinalization needs: the
\* property is about two nodes disagreeing, and a third adds state without
\* adding reachable disagreements.
\*
\* Two candidate blocks per height is likewise the minimum that permits a
\* conflict at all.
\*
\* Runs to completion in a few seconds — see formal/README.md.

SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2, v3, v4}
    ByzantineValidators = {v4}
    Nodes = {n1, n2}
    Blocks = {ba, bb}
    MaxHeight = 3
    \* Uniform stake: identical meaning to the pre-#2255 `Weight(v) == 1`.
    HeavyValidators = {}
    HeavyStake = 1
    LightStake = 1
INVARIANTS
    TypeOK
    NoConflictingFinalization
    QuorumIntersection
    RequiredWeightMatchesSupermajority
    ByzantineWeightWithinBound
    FinalizedBlocksAreKnownBlocks
