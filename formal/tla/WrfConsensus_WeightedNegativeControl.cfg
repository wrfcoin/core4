\* NEGATIVE CONTROL — safe by COUNT, unsafe by STAKE (story #2098, #2255 review).
\*
\* This is the configuration that shows why a uniform-weight result must not be
\* reported as verification of the stake-weighted implementation.
\*
\* By validator COUNT this is the canonical safe shape: n = 4, f = 1. One faulty
\* validator in four sits comfortably inside n > 3f, and WrfConsensus.cfg — the
\* same n and f under uniform stake — completes with no error.
\*
\* By STAKE it is not safe at all. The stake is skewed onto the BYZANTINE
\* validator instead of an honest one:
\*
\*     v4 = 5 (heavy, Byzantine);  v1 = v2 = v3 = 1;  total = 8
\*     Byzantine weight = 5;  5 * 3 = 15, which is NOT < 8.
\*
\* The bound is broken by weight while satisfied by count. v4 cannot finalize
\* unaided (5 * 3 = 15 is not > 8 * 2 = 16), but it needs only ONE honest vote
\* to cross the threshold, and it can pair with a DIFFERENT honest validator on
\* each of two conflicting blocks. The two resulting quorums then intersect
\* only in v4 — which is Byzantine — so QuorumIntersection fails.
\*
\* Expected: TLC REPORTS A VIOLATION. If this configuration ever passes, the
\* weighted machinery has stopped distinguishing stake from count and every
\* weighted result here is worthless. This is the fixture that must be watched
\* failing.

