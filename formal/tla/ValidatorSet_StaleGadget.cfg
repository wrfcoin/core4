\* NEGATIVE CONTROL — this configuration is EXPECTED TO FAIL. Story #2099.
\*
\* `GadgetTracksSet = FALSE` models what `BftFinalityGadget` does today:
\* `new()` (bft_finality.rs:344-353) sums `total_weight` once from the
\* constructor's validators, and no method rotates that set. So after an
\* epoch boundary changes the on-chain validator set, the gadget is still
\* measuring quorum against the OLD total.
\*
\* TLC finalises a block whose backing weight is a supermajority of the
\* gadget's stale total but only a MINORITY of the stake that actually
\* exists — violating FinalizedOnlyByRealSupermajority.
\*
\* This is the negative control that proves the invariant has teeth. Without
\* it, a green run of the positive configurations would not distinguish
\* "finality is safe across rotation" from "Finalize never fires".
\*
\* Run:
\*   java -cp tla2tools.jar tlc2.TLC -config ValidatorSet_StaleGadget.cfg \
\*        ValidatorSet.tla
\* Expected: "Invariant FinalizedOnlyByRealSupermajority is violated."

SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2, v3}
    MaxEpoch = 3
    MaxPower = 2
    EnforceVoteEpoch = TRUE
    GadgetTracksSet = FALSE

INVARIANTS
    TypeOK
    QuorumThresholdSound
    EmptySetCannotFinalize
    NoStaleVoteCounted
    OnlyMembersContributeWeight
    FinalizedOnlyByRealSupermajority
    PendingSetIsNotAuthoritative
