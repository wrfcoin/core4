# Slither Configuration File
# https://github.com/crytic/slither/wiki/Usage#configuration-file

[tool.slither]
# Specify directories to analyze  
target_dir = "contracts"

# Specify files to exclude
exclude = ["contracts/mocks", "contracts/test", "node_modules"]

# Specify detectors to exclude (if any specific ones are too noisy)
# exclude_detectors = ["unused-state", "solc-version", "pragma"]

# Include all detectors by default
detectors_to_run = "all"

# Output formats: text, json, csv, sarif
output_format = "text"

# Generate detailed reports
generate_patches = false
disable_color = false

# Specific to your contracts
solc_version = "0.8.28"
compilation_flags = ["--optimize", "--optimize-runs", "200"]

# Analysis configuration
analyze_contracts = true
analyze_libraries = true

# Advanced options
exclude_optimization = false
exclude_informational = false
exclude_low = false
exclude_medium = false
exclude_high = false

# Print summary
print_summary = true

# Specify custom detectors path (if you have custom detectors)
# detectors_path = "path/to/custom/detectors"