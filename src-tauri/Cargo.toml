[package]
name = "wrfcoin-core"
version = "0.1.0"
description = "Wrfcoin Core - A blockchain operating system for the Wrfcoin blockchain"
authors = ["Wrfcoin Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.57"

[build-dependencies]
tauri-build = { version = "1.2.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.2.4", features = ["api-all"] }
tokio = { version = "1.28.0", features = ["full"] }
log = "0.4.17"
env_logger = "0.10.0"
sha2 = "0.10.6"
hex = "0.4.3"
rand = "0.8.5"
chrono = { version = "0.4.24", features = ["serde"] }
rusqlite = { version = "0.29.0", features = ["bundled"] }
libp2p = { version = "0.56", default-features = false, features = ["tcp", "websocket", "noise", "yamux", "ping", "identify", "kad", "relay", "dcutr", "quic", "tokio"] }
once_cell = "1.17.1"
secp256k1 = { version = "0.27.0", features = ["bitcoin-hashes", "rand-std"] }
bitcoin_hashes = "0.12.0"
bs58 = "0.4.0"
rayon = "1.7.0"
ocl = "0.19.4"  # OpenCL for GPU mining
regex = "1.8.1"
uuid = { version = "1.3.2", features = ["v4", "serde"] }
bincode = "1.3.3"
image = "0.24.6"
thiserror = "1.0.40"
async-trait = "0.1.68"
wgpu = "0.16.1"  # WebGPU API for GPU acceleration
parking_lot = "0.12.1"
dirs = "5.0.1"
reqwest = { version = "0.11.17", features = ["json"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.21"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
