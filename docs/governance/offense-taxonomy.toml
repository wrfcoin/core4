# Offense Taxonomy and Sanction Matrix — WRFCoin Governance
#
# This file is the canonical, machine-readable specification for all protocol
# offenses and their sanction outcomes. Rust (shared-protocol), Solidity, and
# TypeScript implementations MUST produce identical outcomes for the same
# (offense_code, severity_tier) pair.
#
# Values use integer basis points (bps). 10000 bps = 100%.
# Actor class is accepted but NEVER changes the sanction outcome (equal liability).

[meta]
version = 1
schema_version = "1.0"

