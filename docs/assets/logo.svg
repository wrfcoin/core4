<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e3a8a" stroke="#3b82f6" stroke-width="4"/>
  
  <!-- Earth representation -->
  <circle cx="100" cy="100" r="75" fill="#22c55e" opacity="0.8"/>
  
  <!-- Weather elements -->
  <!-- Cloud -->
  <ellipse cx="80" cy="70" rx="15" ry="8" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="85" cy="65" rx="12" ry="6" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="90" cy="70" rx="10" ry="5" fill="#ffffff" opacity="0.9"/>
  
  <!-- Sun rays -->
  <line x1="130" y1="50" x2="140" y2="40" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="60" x2="150" y2="60" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="70" x2="150" y2="80" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Blockchain network nodes -->
  <circle cx="60" cy="120" r="4" fill="#8b5cf6"/>
  <circle cx="140" cy="120" r="4" fill="#8b5cf6"/>
  <circle cx="100" cy="140" r="4" fill="#8b5cf6"/>
  <circle cx="80" cy="160" r="4" fill="#8b5cf6"/>
  <circle cx="120" cy="160" r="4" fill="#8b5cf6"/>
  
  <!-- Network connections -->
  <line x1="60" y1="120" x2="100" y2="140" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="120" x2="100" y2="140" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="140" x2="80" y2="160" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="140" x2="120" y2="160" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="80" y1="160" x2="120" y2="160" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  
  <!-- Central WRF text -->
  <text x="100" y="100" text-anchor="middle" dominant-baseline="middle" 
        font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">WRF</text>
  <text x="100" y="120" text-anchor="middle" dominant-baseline="middle" 
        font-family="Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.8">COIN</text>
  
  <!-- Weather station icon -->
  <rect x="45" y="45" width="3" height="20" fill="#374151"/>
  <circle cx="46.5" cy="42" r="3" fill="#6b7280"/>
  <line x1="43" y1="42" x2="50" y2="42" stroke="#6b7280" stroke-width="1"/>
</svg>