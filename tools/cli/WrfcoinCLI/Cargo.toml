[package]
name = "wrfcoin_cli"
version = "0.1.0"
edition = "2021"
description = "Command line interface for Wrfcoin"
authors = ["Wrfcoin Developers"]

[dependencies]
# External dependencies
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
libc = "0.2"
libp2p-identity = { version = "0.2.13", features = ["ed25519", "peerid"] }
# `snapshot fetch --from /…/p2p/<id>`: the bonded-fetch client (TCP + Noise + yamux,
# one request-response protocol). The wire module is p2p/src/bonded_fetch.rs.
libp2p = { version = "0.56", default-features = false, features = ["tcp", "dns", "noise", "yamux", "request-response", "tokio"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
url = "2.4"
dirs = "5.0"
rusqlite = { version = "0.29", features = ["bundled"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
base64 = "0.21"
sha2.workspace = true
ring = "0.17"
hex = "0.4"
bip39 = { version = "2", features = ["rand"] }
byteorder = "1.5"
shellexpand = "3.1"
rustc-hash = "1.1"
indicatif = "0.17"
console = "0.15"
colored = "2.0"
dialoguer = "0.11"
comfy-table = "7.0"
csv = "1.3"
ratatui = "0.29"
crossterm = "0.28"
wrfcoin-shared-protocol = { path = "../../../shared-protocol" }
wrfcoin-build-provenance = { path = "../../../build-provenance" }
# #3096: `ceremony sign` reads the token PIN from /dev/tty into zeroizing memory
# when built with --features hsm; the plain build has the key-file/hex path only.
zeroize = { version = "1", features = ["serde"] }

[features]
# PKCS#11 signing and the no-PIN token enumeration for `ceremony custody --check`.
hsm = ["wrfcoin-shared-protocol/hsm"]

[dev-dependencies]
wrfcoin-shared-protocol = { path = "../../../shared-protocol", features = ["integration-guard", "test-support"] }
mockito = "0.32"

[[bin]]
name = "wrfcoin"
path = "src/main.rs"
