# WRFCoin forecaster worker v0.
#   mkdir -p worker-data
#   docker compose build
#   docker compose run --rm worker once --dry-run     # try it, sends nothing
#   docker compose up -d                              # run it
services:
  worker:
    build: .
    image: wrfcoin-forecaster-worker:local
    restart: unless-stopped
    # Your user id, so the wallet file in ./worker-data belongs to you (Linux: `id -u`).
    user: "${WORKER_UID:-1000}:${WORKER_GID:-1000}"
    environment:
      WORKER_STATIONS: "auto"
      WORKER_VARIABLE: "temperature_c"
      WORKER_LEADS: "1,6,12,24"
      WORKER_CYCLE_SECONDS: "3600"
      WRFCOIN_API: "https://wrfcoin.com/api"
    volumes:
      - ./worker-data:/data
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
