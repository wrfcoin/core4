[package]
name = "wrfcoin-forecast-proto"
version.workspace = true
edition = "2021"
publish = false
description = "Prototype forecast producer + scorer for the WRFCoin forecast earning loop (2026-09-09)"

[[bin]]
name = "forecast-proto"
path = "src/main.rs"

[dependencies]
wrfcoin-shared-protocol = { path = "../../shared-protocol" }
wrfcoin-forecast-score = { path = "../../forecast-score" }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
sha3 = { workspace = true }
chrono = { workspace = true }
tract-onnx = "=0.23.7"
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"
