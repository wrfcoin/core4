# SonarQube Project Configuration for WRFCoin Blockchain Platform
# This configuration defines multi-language analysis for the comprehensive blockchain platform

# Project identification
sonar.projectKey=wrfcoin-blockchain-platform
sonar.projectName=WRFCoin Climate-Focused Blockchain Platform
sonar.projectVersion=1.0.0
sonar.organization=wrfcoin

# Source code directories
sonar.sources=frontend/src,backend,blockchain-core/src,contracts,scripts
sonar.tests=frontend/src/**/*.test.*,backend/**/*.test.*,blockchain-core/tests,contracts/test,consolidated-tests

# Language-specific configurations
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.stories.*,**/test/**,**/tests/**,**/coverage/**,**/node_modules/**,**/dist/**,**/build/**,**/*.d.ts

# File exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/artifacts/**,\
  **/cache/**,\
  **/target/**,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/migrations/**,\
  **/archive/**,\
  **/attached_assets/**,\
  **/logs/**,\
  **/certs/**,\
  **/.env*,\
  **/package-lock.json,\
  **/yarn.lock,\
  **/Cargo.lock

# Test exclusions from duplication analysis
sonar.cpd.exclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  **/test/**,\
  **/tests/**,\
  **/migrations/**

# Language-specific source directories
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.rust.sources=blockchain-core/src
sonar.solidity.sources=contracts

# Quality gate thresholds
sonar.qualitygate.wait=true

# Analysis parameters
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.scm.disabled=false

# Security analysis
sonar.security.hotspots.new=true
sonar.security.review.rating.new=A

# Duplication analysis
sonar.cpd.cross_project=true

# Issue exclusions for generated files
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Generated contract artifacts
sonar.issue.ignore.multicriteria.e1.resourceKey=artifacts/**/*.json
sonar.issue.ignore.multicriteria.e1.ruleKey=*

# Migration files (database schema changes are often repetitive)
sonar.issue.ignore.multicriteria.e2.resourceKey=**/migrations/*.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=common-js:DuplicatedBlocks

# Configuration files (may have similar structure)
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*config*.js
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S1192

# Test fixtures and mocks
sonar.issue.ignore.multicriteria.e4.resourceKey=**/test/**/*.js
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S1192

# TypeScript declaration files
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.d.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=*

# Project-specific rules
# Allow console.log in development files
sonar.javascript.environments=node,browser,jest

# Rust-specific configurations
sonar.rust.clippy.reportPaths=target/clippy-report.json

# Coverage thresholds (align with existing Jest configuration)
sonar.coverage.line.minimum=80
sonar.coverage.branch.minimum=80
sonar.coverage.function.minimum=80
sonar.coverage.statement.minimum=80

# New code quality requirements
sonar.new_code.coverage.line.minimum=80
sonar.new_code.duplicated_lines_density.maximum=3
sonar.new_code.maintainability_rating=A
sonar.new_code.reliability_rating=A
sonar.new_code.security_rating=A

# Large files analysis
sonar.analysis.max_size=5242880

# Branch analysis
sonar.branch.name=${GITHUB_HEAD_REF}
sonar.branch.target=${GITHUB_BASE_REF}