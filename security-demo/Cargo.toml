[package]
name = "wrfcoin-security-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { workspace = true }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[bin]]
name = "security_demo"
path = "src/main.rs"