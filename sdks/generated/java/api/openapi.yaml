openapi: 3.0.3
info:
  contact:
    email: api@wrfcoin.com
    name: Wrfcoin API Support
    url: https://docs.wrfcoin.com
  description: |
    Comprehensive API for the Wrfcoin climate-focused blockchain platform.
    Includes weather data collection, smart contracts, governance, and
    environmental impact tracking.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://wrfcoin.com/terms
  title: Wrfcoin Blockchain Platform API
  version: 1.0.0
servers:
  - description: Production server
    url: https://api.wrfcoin.com/v1
  - description: Staging server
    url: https://staging-api.wrfcoin.com/v1
  - description: Local development server
    url: http://localhost:3001
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - description: Core blockchain operations
    name: Blockchain
  - description: Smart contract deployment and execution
    name: Smart Contracts
  - description: DAO governance and voting
    name: Governance
  - description: Environmental data collection and rewards
    name: Weather Data
  - description: Wallet and key management
    name: Wallet
  - description: Computational and environmental NFTs
    name: NFT
  - description: IoT sensor network management
    name: IoT
  - description: Mining operations and rewards
    name: Mining
  - description: Network analytics and metrics
    name: Analytics
  - description: System health and status
    name: System
  - description: Security operations and statistics
    name: Security
  - description: Compliance status and certifications
    name: Compliance
  - description: Third-party integrations and AI services
    name: Integrations
  - description: Compute network operations
    name: Compute
  - description: AI and machine learning services
    name: AI/ML
  - description: Performance monitoring and optimization
    name: Performance
paths:
  /api/blockchain/status:
    get:
      description:
        "Returns current blockchain status including block height, network\
        \ health, and consensus state"
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockchainStatus'
          description: Blockchain status retrieved successfully
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      summary: Get blockchain status
      tags:
        - Blockchain
      x-accepts:
        - application/json
  /api/blockchain/blocks:
    get:
      description: Retrieve a list of blockchain blocks with pagination
      parameters:
        - description: Number of blocks to return
          explode: true
          in: query
          name: limit
          required: false
          schema:
            default: 10
            maximum: 100
            minimum: 1
            type: integer
          style: form
        - description: Number of blocks to skip
          explode: true
          in: query
          name: offset
          required: false
          schema:
            default: 0
            minimum: 0
            type: integer
          style: form
        - description: Sort order
          explode: true
          in: query
          name: order
          required: false
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
          style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_blockchain_blocks_get_200_response'
          description: Blocks retrieved successfully
      summary: Get blockchain blocks
      tags:
        - Blockchain
      x-accepts:
        - application/json
  /api/blockchain/blocks/{blockHash}:
    get:
      parameters:
        - explode: false
          in: path
          name: blockHash
          required: true
          schema:
            pattern: '^0x[a-fA-F0-9]{64}$'
            type: string
          style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
          description: Block retrieved successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Block not found
      summary: Get block by hash
      tags:
        - Blockchain
      x-accepts:
        - application/json
  /api/blockchain/transactions/{txHash}:
    get:
      parameters:
        - explode: false
          in: path
          name: txHash
          required: true
          schema:
            pattern: '^0x[a-fA-F0-9]{64}$'
            type: string
          style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: Transaction retrieved successfully
      summary: Get transaction by hash
      tags:
        - Blockchain
      x-accepts:
        - application/json
  /api/contracts/deploy:
    post:
      description: Deploy a new smart contract to the blockchain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractDeployRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDeployResponse'
          description: Contract deployed successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid contract code or parameters
      summary: Deploy smart contract
      tags:
        - Smart Contracts
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/contracts/call:
    post:
      description: Execute a smart contract function
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCallRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCallResponse'
          description: Contract function executed successfully
      summary: Call contract function
      tags:
        - Smart Contracts
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/contracts/query:
    post:
      description: Query smart contract state without modifying it
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractQueryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractQueryResponse'
          description: Contract state queried successfully
      summary: Query contract state
      tags:
        - Smart Contracts
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/contracts/estimate-gas:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCallRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_contracts_estimate_gas_post_200_response'
          description: Gas estimate calculated
      summary: Estimate gas for contract call
      tags:
        - Smart Contracts
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/governance/proposals:
    get:
      parameters:
        - explode: true
          in: query
          name: status
          required: false
          schema:
            enum:
              - active
              - pending
              - executed
              - defeated
            type: string
          style: form
        - explode: true
          in: query
          name: limit
          required: false
          schema:
            default: 20
            type: integer
          style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Proposal'
                type: array
          description: Proposals listed successfully
      summary: List governance proposals
      tags:
        - Governance
      x-accepts:
        - application/json
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: Proposal created successfully
      summary: Create new proposal
      tags:
        - Governance
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/governance/proposals/{proposalId}/vote:
    post:
      parameters:
        - explode: false
          in: path
          name: proposalId
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
          description: Vote cast successfully
      summary: Vote on proposal
      tags:
        - Governance
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/weather/submit:
    post:
      description: Submit environmental data from weather stations
      requestBody:
        content:
          application/json:
            examples:
              basic_submission:
                summary: Basic weather data submission
                value:
                  stationId: station_001
                  sensorData:
                    - type: temperature
                      value: 23.5
                      unit: celsius
                      status: active
                    - type: humidity
                      value: 65.2
                      unit: percent
                      status: active
                  location:
                    latitude: 40.7128
                    longitude: -74.006
                    altitude: 10
                  quality:
                    score: 95
                    issues: []
            schema:
              $ref: '#/components/schemas/WeatherDataSubmission'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                successful_submission:
                  summary: Successful weather data submission
                  value:
                    success: true
                    data:
                      stationId: station_001
                      timestamp: 2024-01-15T10:30:00Z
                      rewards:
                        totalAmount: 0.17
                        baseAmount: 0.1
                        qualityBonus: 0.05
                        proximityBonus: 0.02
                      blockchain:
                        blockNumber: 123456
                        transactionHash: 0x1234567890abcdef...
                        gasUsed: 21000
                    message: Weather data submitted successfully
                    timestamp: 2024-01-15T10:30:00Z
              schema:
                $ref: '#/components/schemas/WeatherSubmissionResponse'
          description: Weather data submitted successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid weather data
      security:
        - ApiKeyAuth: []
      summary: Submit weather data
      tags:
        - Weather Data
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/weather/data:
    get:
      parameters:
        - explode: true
          in: query
          name: station_id
          required: false
          schema:
            type: string
          style: form
        - explode: true
          in: query
          name: start_date
          required: false
          schema:
            format: date-time
            type: string
          style: form
        - explode: true
          in: query
          name: end_date
          required: false
          schema:
            format: date-time
            type: string
          style: form
        - explode: true
          in: query
          name: data_type
          required: false
          schema:
            enum:
              - temperature
              - humidity
              - pressure
              - wind
              - precipitation
            type: string
          style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WeatherData'
                type: array
          description: Weather data retrieved successfully
      summary: Get weather data
      tags:
        - Weather Data
      x-accepts:
        - application/json
  /api/weather/security-status:
    get:
      description: Retrieve security status of weather stations and data integrity
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherSecurityStatus'
          description: Weather security status retrieved successfully
      summary: Get weather security status
      tags:
        - Weather Data
      x-accepts:
        - application/json
  /api/mining/rewards:
    get:
      description: Retrieve mining rewards for a specific address
      parameters:
        - description: Wallet address to get rewards for
          explode: true
          in: query
          name: address
          required: false
          schema:
            pattern: '^0x[a-fA-F0-9]{40}$'
            type: string
          style: form
        - description: Type of mining reward
          explode: true
          in: query
          name: type
          required: false
          schema:
            enum:
              - weather_data
              - compute
              - validation
              - staking
            type: string
          style: form
        - description: Number of rewards to return
          explode: true
          in: query
          name: limit
          required: false
          schema:
            default: 10
            maximum: 100
            minimum: 1
            type: integer
          style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_mining_rewards_get_200_response'
          description: Mining rewards retrieved successfully
      summary: Get mining rewards
      tags:
        - Mining
      x-accepts:
        - application/json
  /api/analytics:
    get:
      description: Retrieve comprehensive network analytics and metrics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_analytics_get_200_response'
          description: Network analytics retrieved successfully
      summary: Get network analytics
      tags:
        - Analytics
      x-accepts:
        - application/json
  /health:
    get:
      description: Get comprehensive system health status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_health_get_200_response'
          description: System health status retrieved successfully
      summary: System health check
      tags:
        - System
      x-accepts:
        - application/json
  /api/health:
    get:
      description: Get comprehensive API health status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_health_get_200_response'
          description: API health status retrieved successfully
      summary: API health check
      tags:
        - System
      x-accepts:
        - application/json
  /api/security/stats:
    get:
      description: Retrieve security statistics and events
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_security_stats_get_200_response'
          description: Security statistics retrieved successfully
      summary: Get security statistics
      tags:
        - Security
      x-accepts:
        - application/json
  /api/compliance/status:
    get:
      description: Retrieve compliance status and certifications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_compliance_status_get_200_response'
          description: Compliance status retrieved successfully
      summary: Get compliance status
      tags:
        - Compliance
      x-accepts:
        - application/json
  /api/integrations/langchain/status:
    get:
      description: Retrieve status of LangChain analytics integration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_integrations_langchain_status_get_200_response'
          description: LangChain integration status retrieved successfully
      summary: Get LangChain integration status
      tags:
        - Integrations
      x-accepts:
        - application/json
  /api/integrations/langchain/enable:
    post:
      description: Enable LangChain analytics integration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_integrations_langchain_enable_post_200_response'
          description: LangChain integration enabled successfully
      summary: Enable LangChain integration
      tags:
        - Integrations
      x-accepts:
        - application/json
  /api/integrations/langchain/insights:
    get:
      description: Retrieve AI-powered insights from LangChain analytics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_integrations_langchain_insights_get_200_response'
          description: LangChain insights retrieved successfully
      summary: Get LangChain insights
      tags:
        - Integrations
      x-accepts:
        - application/json
  /api/compute/tasks:
    post:
      description: Submit a distributed computing task to the network
      requestBody:
        content:
          application/json:
            examples:
              ml_task:
                summary: Machine learning task
                value:
                  taskType: machine-learning
                  priority: high
                  resourceRequirements:
                    cpu: 8
                    memory: 32
                    storage: 100
                    gpu: true
            schema:
              $ref: '#/components/schemas/_api_compute_tasks_post_request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_compute_tasks_post_200_response'
          description: Task submitted successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid task request
      summary: Submit compute task
      tags:
        - Compute
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/compute/tasks/{taskId}/status:
    get:
      description: Retrieve the status of a specific compute task
      parameters:
        - description: Task identifier
          explode: false
          in: path
          name: taskId
          required: true
          schema:
            type: string
          style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_compute_tasks__taskId__status_get_200_response'
          description: Task status retrieved successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Task not found
      summary: Get compute task status
      tags:
        - Compute
      x-accepts:
        - application/json
  /api/compute/providers:
    get:
      description: Retrieve list of available compute providers
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_compute_providers_get_200_response'
          description: Compute providers retrieved successfully
      summary: List compute providers
      tags:
        - Compute
      x-accepts:
        - application/json
  /api/aiml/models:
    get:
      description: Retrieve list of available AI/ML models for computation
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_aiml_models_get_200_response'
          description: AI/ML models retrieved successfully
      summary: List available AI/ML models
      tags:
        - AI/ML
      x-accepts:
        - application/json
  /api/aiml/inference:
    post:
      description: Execute AI/ML inference on the compute network
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_api_aiml_inference_post_request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_aiml_inference_post_200_response'
          description: Inference completed successfully
      summary: Run AI/ML inference
      tags:
        - AI/ML
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/performance/metrics:
    get:
      description: Retrieve comprehensive performance metrics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_performance_metrics_get_200_response'
          description: Performance metrics retrieved successfully
      summary: Get performance metrics
      tags:
        - Performance
      x-accepts:
        - application/json
  /api/performance/optimization:
    post:
      description: Initiate performance optimization procedures
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_api_performance_optimization_post_request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_performance_optimization_post_200_response'
          description: Optimization initiated successfully
      summary: Trigger performance optimization
      tags:
        - Performance
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/wallet/generate-mnemonic:
    post:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_wallet_generate_mnemonic_post_200_response'
          description: Mnemonic generated successfully
      summary: Generate mnemonic phrase
      tags:
        - Wallet
      x-accepts:
        - application/json
  /api/wallet/validate-mnemonic:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_api_wallet_validate_mnemonic_post_request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_api_wallet_validate_mnemonic_post_200_response'
          description: Mnemonic validation result
      summary: Validate mnemonic phrase
      tags:
        - Wallet
      x-content-type: application/json
      x-accepts:
        - application/json
  /api/wallet/hardware/devices:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/HardwareDevice'
                type: array
          description: Hardware devices listed
      summary: List connected hardware wallets
      tags:
        - Wallet
      x-accepts:
        - application/json
  /api/wallet/hardware/sign:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwareSignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwareSignResponse'
          description: Transaction signed successfully
      summary: Sign transaction with hardware wallet
      tags:
        - Wallet
      x-content-type: application/json
      x-accepts:
        - application/json
components:
  schemas:
    Error:
      example:
        code: code
        details: '{}'
        error: error
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        error:
          description: Error message
          type: string
        code:
          description: Error code
          type: string
        details:
          description: Additional error details
          type: object
        timestamp:
          format: date-time
          type: string
      required:
        - code
        - error
      type: object
    BlockchainStatus:
      example:
        difficulty: 1.4658129805029452
        lastBlockHash: lastBlockHash
        blockHeight: 0
        peerCount: 5
        consensusState: healthy
        networkHashRate: 6.027456183070403
        uptimeSeconds: 5
        syncStatus: synced
      properties:
        blockHeight:
          description: Current block height
          type: integer
        lastBlockHash:
          description: Hash of the most recent block
          type: string
        networkHashRate:
          description: Network hash rate in H/s
          type: number
        difficulty:
          description: Current mining difficulty
          type: number
        consensusState:
          enum:
            - healthy
            - degraded
            - failed
          type: string
        peerCount:
          description: Number of connected peers
          type: integer
        syncStatus:
          enum:
            - synced
            - syncing
            - out_of_sync
          type: string
        uptimeSeconds:
          description: Node uptime in seconds
          type: integer
      type: object
    Block:
      example:
        difficulty: 5.962133916683182
        gasLimit: 9
        gasUsed: 7
        previousHash: previousHash
        size: 2
        index: 0
        merkleRoot: merkleRoot
        transactionCount: 5
        nonce: 1
        hash: hash
        timestamp: 6
      properties:
        hash:
          description: Block hash
          type: string
        index:
          description: Block number
          type: integer
        previousHash:
          description: Previous block hash
          type: string
        timestamp:
          description: Block timestamp
          type: integer
        merkleRoot:
          description: Merkle root of transactions
          type: string
        nonce:
          description: Mining nonce
          type: integer
        difficulty:
          description: Block difficulty
          type: number
        transactionCount:
          description: Number of transactions in block
          type: integer
        size:
          description: Block size in bytes
          type: integer
        gasUsed:
          description: Total gas used in block
          type: integer
        gasLimit:
          description: Block gas limit
          type: integer
      type: object
    Transaction:
      example:
        blockHash: blockHash
        transactionIndex: 5
        nonce: 1
        gasUsed: 6
        blockNumber: 5
        gas: 0
        from: from
        to: to
        value: value
        hash: hash
        gasPrice: gasPrice
        status: pending
        timestamp: 2
      properties:
        hash:
          description: Transaction hash
          type: string
        from:
          description: Sender address
          type: string
        to:
          description: Recipient address
          type: string
        value:
          description: Transaction value in wei
          type: string
        gas:
          description: Gas limit
          type: integer
        gasPrice:
          description: Gas price in wei
          type: string
        gasUsed:
          description: Gas used
          type: integer
        nonce:
          description: Transaction nonce
          type: integer
        blockHash:
          description: Block hash containing transaction
