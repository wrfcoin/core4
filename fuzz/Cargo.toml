[package]
name = "wrfcoin-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wrfcoin-shared-protocol = { path = "../shared-protocol" }
wrfcoin-privacy = { path = "../privacy" }
wrfcoin-p2p = { path = "../p2p" }
wrfcoin-consensus-engines = { path = "../consensus-engines" }
wrfcoin-zk-circuits = { path = "../zk-circuits" }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt"] }
rustc-hash = "2"
bincode = "1.3"
libp2p-identity = { version = "0.2", features = ["ed25519"] }
ark-bn254 = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-serialize = { version = "=0.6.0", features = ["derive"] }

[[bin]]
name = "fuzz_transaction_deserialize"
path = "fuzz_targets/fuzz_transaction_deserialize.rs"
doc = false

[[bin]]
name = "fuzz_range_proof_verify"
path = "fuzz_targets/fuzz_range_proof_verify.rs"
