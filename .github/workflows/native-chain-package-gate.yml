name: native-chain package gate (baseline-aware)
# WORKFLOW-GATE: keeps native-chain test regressions attributable on main

# WHY THIS FILE EXISTS — core4 #2911, the 27-day coverage hole
# ------------------------------------------------------------
# `cargo test -p wrfcoin-native-chain` has been REAL-RED on `main` since
# 2026-08-04 (`19af70d33`, "#2713 regression artifact, REAL-RED by design").
# Four tests in `chain_identity_split_2713` fail deliberately; #2713 is open and
# the RED is the proof, so they stay.
#
# The cost was that native-chain had no package gate at all for 27 days, by two
# separate mechanisms:
#
#   1. VERDICT MASKING. A permanently-red command reports exit 101 whether the
#      four known failures are the only ones or not. A fresh break produced an
#      identical observable, and telling them apart meant diffing failure names
#      by eye against a 27-day-old commit message.
#   2. EXECUTION MASKING, which is worse and is invisible in the verdict.
#      Without `--no-fail-fast`, cargo STOPS at the first failing test binary.
#      `chain_identity_split_2713` sorts third of 45 native-chain integration
#      targets, so the package command never built most of the suite. Those
#      tests did not pass. They never ran.
#
# This job does not make native-chain green — it must not, #2713 is open. It
# makes the red LEGIBLE: `scripts/package_test_baseline_gate.py` names the four
# standing failures by identity and emits a positive, attributed statement about
# everything else. That is the #2923 taxonomy applied to a red gate rather than a
# green one.
#
# THREE VERDICTS, NEVER TWO
# -------------------------
#   exit 0  BASELINE — exactly the declared failures failed, by name, and nothing
#           else did.
#   exit 1  REAL-RED, attributable — NEW_FAILURE (a test the baseline does not
#           declare), HEALED (a declared failure PASSED: #2713 may be fixed —
#           promote it — or the assertion was weakened), or MISSING (a declared
#           failure was deleted or renamed, the other way to make a standing red
#           disappear).
#   exit 2  GATE BROKEN / VOID — nothing compiled, a declared target produced no
#           libtest summary, an integration binary ran and declared nothing, or a
#           non-vacuity floor was not met. NOT evidence in either direction.
#
# In GitHub Actions 1 and 2 are both a red check, and that is fine: the
# distinction lives in the annotations and the log, where the reader is. What is
# NOT fine is collapsing them in the reasoning — that is how a broken harness
# reads as a finding and how a real finding gets waved away as "probably just the
# harness".
#
# NO `continue-on-error`
# ----------------------
# It maps all three outcomes onto green — wrapper-only success, VOID under the
# evidence standard, able to neither admit nor block. `main` carries no required
# status checks today (ruleset `main-protection` holds `deletion`,
# `non_fast_forward`, `required_linear_history`, `pull_request`; re-verify with
# `gh api repos/wrfcoin/core4/rules/branches/main`), so failing for real here is
# safe. If a required-checks rule is ever added, exclude this workflow by name or
# park it BEFORE enabling it — do not blind the check.
#
# TRIGGER SHAPE, AND ITS STATED GAP
# ---------------------------------
# PR paths are native-chain's own sources and tests plus the gate's script and
# manifest, so an unrelated PR is not painted by a fact it did not cause. On
# `push: main` the filter widens to `**/*.rs`, because native-chain depends on
# shared-protocol, p2p and consensus-engines, and a break arriving from one of
# those is exactly the fresh failure this gate exists to name. KNOWN GAP, stated
# rather than hidden: a PR that changes only shared-protocol will not run this
# gate before merge; it surfaces on the merge to main. Run it by hand on such a
# branch when the change is load-bearing for native-chain:
#   gh workflow run native-chain-package-gate.yml --ref <branch>
# No cron — the org Actions budget was exhausted twice this sprint and
# scripts/schedule_trigger_lint.py holds an empty ALLOWED_SCHEDULES on purpose.

on:
  pull_request:
    paths:
      - 'native-chain/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/package_test_baseline_gate.py'
      - 'scripts/test_package_test_baseline_gate.py'
      - 'scripts/package_test_baselines.json'
      - '.github/workflows/native-chain-package-gate.yml'
      - '.cargo/**'
      - '**/Cargo.toml'
      - '.github/actions/**'
      - 'build-provenance/**'
      - 'consensus-engines/**'
      - 'da/**'
      - 'dataset-manifest/**'
      - 'evm/**'
      - 'execution-engine/**'
      - 'forecast-score/**'
      - 'geo-grid/**'
      - 'meteo-types/**'
      - 'p2p/**'
      - 'primitives/**'
      - 'privacy/**'
      - 'reputation-engine/**'
      - 'shared-protocol/**'
      - 'tools/cli/WrfcoinCLI/**'
      - 'zk-circuits/**'
      - 'scripts/**'
      - 'tests/**'
      - '**/*.env'
      - '**/.env'
      - '**/.env.*'
      - '**/*.json'
      - '**/*.jsonl'
      - '**/*.toml'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sh'
      - '**/*.conf'
  push:
    branches:
      - 'main'
    paths:
      - '**/*.rs'
      - 'Cargo.lock'
      - 'scripts/package_test_baseline_gate.py'
      - 'scripts/package_test_baselines.json'
      - '.github/workflows/native-chain-package-gate.yml'
  # Owner relevance/nightly ruling 2026-10-07; schedule policy Refs #2498.
  schedule:
    - cron: '44 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# The #2928 shape for this repo: workflow-unique group keyed on ref, with
# UNCONDITIONAL cancel-in-progress. Cancelling only on pull_request would leave
# push-to-main uncancellable, which is the trigger where a superseded ~1,900-test
# run stacking behind a newer SHA hurts a serial runner most. A superseded run's
# verdict has no retained value here: this gate answers "is CURRENT main exactly
# as red as it is declared to be", and only the newest SHA answers that.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, no `needs:` edges — so there is no fan-out in which a skipped
  # dependency reads as success, and scripts/check_terminal_skip_guards.py has
  # nothing to guard here. The check-run result IS the classifier's verdict.
  native-chain-baseline:
    name: native-chain is exactly as red as it is declared to be
    # Self-hosted for the same two reasons named-test-targets.yml records:
    # hosted images have died with `No space left on device` building these very
    # targets, and hosted minutes are exhausted, so a hosted-only gate whose
    # purpose is to run what nothing else runs would itself run nothing. If the
    # runner is offline the job QUEUES rather than skipping — deliberate: a
    # skipped job reads GREEN in rollups.
    runs-on: ubuntu-latest
    # A cold build of all 45 native-chain integration targets is the expensive
    # case; warm-cache runs are minutes.
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refs #3621: reclaim hosted disk before cache restore or compilation.
      - name: Free unused preinstalled toolchains (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null
          echo "after:"; df -h /
          echo "WRFCOIN_HEAVY_BUILD_MIN_FREE_GIB=10" >> "$GITHUB_ENV"
          python3 -c "import shutil; print(f'free for the heavy-build guard: {shutil.disk_usage(\".\").free / 1024**3:.1f} GiB (hosted floor 10)')"

      - name: Put rustup's cargo on PATH
        # The runner service's non-interactive environment does not source
        # ~/.cargo/env; other jobs on this runner fail confusingly without it.
        run: echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      # STEP 0 — DISK PREFLIGHT, ahead of the toolchain and the cache. An ENOSPC
      # part-way through a cargo build surfaces as a compile failure, which is
      # indistinguishable from a real finding; an ambiguous red is worse than a
      # loud refusal. Exits 2, this gate's VOID code, so a disk problem is never
      # reported as evidence about the code.
      - name: Preflight — enough disk for the build
        run: |
          set -euo pipefail
          FLOOR_GB="${WRFCOIN_HEAVY_BUILD_MIN_FREE_GIB:-40}"
          if [[ ! "$FLOOR_GB" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::GATE VOID — WRFCOIN_HEAVY_BUILD_MIN_FREE_GIB must be a whole number of GiB."
            exit 2
          fi
          # Measure the filesystem the BUILD lands on, not the runner's checkout disk:
          # the self-hosted runners export CARGO_TARGET_DIR onto the 36T build pool while
          # _work sits on the 236G root disk, so probing `.` voided every run once the
          # root disk crossed the floor even though target/ had terabytes free. Walk up
          # to the nearest existing ancestor so a first run (no target dir yet) still probes.
          DISK_PROBE="${CARGO_TARGET_DIR:-.}"
          while [ ! -e "${DISK_PROBE}" ]; do DISK_PROBE=$(dirname "${DISK_PROBE}"); done
          echo "disk probe path=${DISK_PROBE} (CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-<unset>})"
          AVAIL_GB=$(df -BG --output=avail "${DISK_PROBE}" | tail -1 | tr -dc '0-9')
          echo "free=${AVAIL_GB}G floor=${FLOOR_GB}G"
          if [ "$AVAIL_GB" -lt "$FLOOR_GB" ]; then
            echo "::error::GATE VOID — only ${AVAIL_GB}G free, need ${FLOOR_GB}G." \
                 "A debug build of native-chain's 45 integration targets was" \
                 "measured at 16G of target/ on 2026-08-31; continuing would" \
                 "ENOSPC mid-compile and report as a test failure. This is NOT" \
                 "evidence about the code. Reclaim disk and re-run."
            exit 2
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'

      # CT102 data cap (infra#1113, core4#2955): skip the GitHub cache on
      # self-hosted runners. CT102's per-runner CARGO_HOME, RUSTUP_HOME and
      # CARGO_TARGET_DIR (/build/*-<runner>) persist between jobs, so this restore
      # re-downloaded 127-384 MB per job over a metered line for nothing. Hosted
      # runners keep the cache.
      - name: Cache Cargo registry and build
        if: runner.environment != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nc-package-gate-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nc-package-gate-${{ runner.os }}-cargo-

      # STEP 1 — CONTROL. Must pass, and runs no cargo, so a broken toolchain
      # cannot make the observation below it vacuously green. The unit tests pin
      # the fail-closed behaviours (absence is not a pass; a deleted pinned test
      # is a finding; --no-fail-fast is mandatory); --self-test proves the
      # shipped classifier reaches all three verdicts and all three finding
      # kinds. A gate that cannot demonstrate its own RED is not evidence
      # (docs/ci/VACUOUS_GATES.md check 1).
      - name: Control — the classifier can reach every verdict it claims
        run: |
          python3 scripts/test_package_test_baseline_gate.py
          python3 scripts/package_test_baseline_gate.py --self-test

      # STEP 1b — structural control, separate so a stale baseline is
      # distinguishable at a glance from a failing test. A manifest that no
      # longer describes this tree would let the observation cover less than it
      # claims and still exit 0.
      - name: Control — the baseline still describes this tree
        run: python3 scripts/package_test_baseline_gate.py --preflight-only

      # STEP 2 — OBSERVATION. Prints the raw cargo output before its verdict, so
      # the evidence for the claim is in the same log as the claim.
      - name: Observe — is native-chain exactly as red as it is declared to be
        run: python3 scripts/package_test_baseline_gate.py --package wrfcoin-native-chain
