name: Public PR admission

# Owner launch ruling 2026-10-19: hosted PR checks replace pre-merge integration
# admission. Full integration evidence is collected only after merge or manually.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: public-admission-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: public Rust lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Refs #3621: reclaim hosted disk before cache restore or compilation.
      - name: Free unused preinstalled toolchains (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null
          echo "after:"; df -h /
          echo "WRFCOIN_HEAVY_BUILD_MIN_FREE_GIB=10" >> "$GITHUB_ENV"
          python3 -c "import shutil; print(f'free for the heavy-build guard: {shutil.disk_usage(\".\").free / 1024**3:.1f} GiB (hosted floor 10)')"
      - name: Merge-ref freshness
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-ref-freshness
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libclang-dev protobuf-compiler libudev-dev libpcsclite-dev
      - name: Formatting debt (advisory, existing repository policy)
        continue-on-error: true
        run: cargo fmt --all -- --check
      # Match ci-readiness.yml: existing workspace lint debt is advisory.
      # Refs #3618; restore blocking Clippy after the post-GO debt inventory.
      - name: Clippy libraries (advisory)
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --workspace --lib --all-features -- -D warnings
      - name: Report Clippy outcome
        if: always()
        env:
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          case "$CLIPPY_OUTCOME" in
            success)
              echo '### Workspace Clippy: PASS' >> "$GITHUB_STEP_SUMMARY"
              ;;
            failure)
              echo '::warning::Workspace Clippy failed (advisory; debt tracked in #3618)'
              echo '### Workspace Clippy: FAIL (advisory; #3618)' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::Workspace Clippy did not execute to completion'
              exit 1
              ;;
          esac
      - name: Workspace library unit tests
        run: cargo test --locked --workspace --lib --all-features

  policy:
    name: public workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install pyyaml==6.0.2
      - run: python3 scripts/check_public_workflow_policy.py
      - run: python3 scripts/test_public_workflow_policy.py
      - run: python3 scripts/test_hosted_heavy_build_disk.py
      - run: python3 scripts/test_public_admission_outcomes.py
      - run: python3 scripts/schedule_trigger_lint.py
      - run: python3 scripts/test_ratchet_covers_admission_inputs.py

  admission:
    name: public PR admission
    if: always()
    needs: [rust, policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require executed successful workers
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
          GATE_REQUIRED: rust policy
          GATE_CONDITIONAL: ''
        run: python3 scripts/assert_gate_results.py
