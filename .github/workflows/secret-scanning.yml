name: Secret Scanning

# Push coverage restored for the zero-cost self-hosted `detect-secrets` job
# (#2887). The hosted `secret-leak-scan` job remains pull-request-only through
# its job-level event guard below, so restoring branch-tip coverage consumes no
# hosted Actions minutes.
#
# SHOULD THE #2129 LEG RUN ON PUSH? No — pull-request-only is deliberate, and
# this note exists so it is not re-filed (#2912, item 4). Three reasons:
#
#   1. It is `ubuntu-latest`. Every push to every branch would draw hosted
#      minutes against a budget that is deliberately zero-spend, and `push:
#      branches: ["**"]` makes that per-branch-tip, not per-merge.
#   2. Its surface is already covered before the code lands. #2129 is about
#      secrets reaching logs, metrics, errors and crash reports — a property of
#      the code, which the merge-tree pull_request scan evaluates before merge.
#      Credentials committed AT REST are a different surface, and the zero-cost
#      `detect-secrets` job covers those on every branch tip.
#   3. The two are not redundant, so parking the hosted one loses less than it
#      looks: the self-hosted detector still runs on push.
#
# The residual, stated so nobody has to rediscover it: a change that reaches
# `main` WITHOUT a pull request — an admin bypass of the `main-protection`
# ruleset — is never seen by the #2129 leg. If direct-to-main pushes ever become
# routine, or if hosted minutes stop being the constraint, revisit this.
# DO NOT narrow the `push` trigger to save Actions minutes. It has been tried
# (#2306) and reverted; the duplicate below is deliberate.
#
# `push: ["**"]` and `pull_request` do fire twice for one commit, and the
# concurrency group cannot collapse them because the refs differ
# (`refs/heads/x` vs `refs/pull/N/merge`). That duplicate is ~16% of all Actions
# runs. It is still the right trade, for this gate specifically:
#
#   * A leaked credential is compromised the MOMENT it reaches GitHub, whether
#     or not a PR exists. Detection that waits for a PR is later than the
#     damage. For a lint, delay is harmless; for secret scanning it is the whole
#     point of the gate.
#   * `push` covers every branch at its tip, including branches with no PR.
#   * `pull_request` is what puts a result on the PR, and it scans the MERGE
#     tree (head + base) rather than the branch tip — a different tree, not a
#     redundant one.
#
# Deduplicating by keying concurrency on the commit SHA instead of the ref was
# evaluated and rejected: both runs start from the same push, so which one
# cancels the other is a race, and roughly half the time it would cancel the
# `pull_request` run — leaving the PR's Secret Scanning check reporting
# `cancelled`, which is not a pass. It would also make WHICH tree was scanned
# nondeterministic. A security gate that reports a coin flip is worse than one
# that costs 16%.
#
# Savings for this workflow, if any are wanted later, must come from making a
# run cheaper — not from scanning fewer pushes.
#
# #2945: this workflow is NOT one of the ordinary `push: branches: [main]`
# cases the sibling fix (`cancel-in-progress: ${{ github.event_name ==
# 'pull_request' }}`) targets, because its `push` trigger is `branches:
# ["**"]` above, by design (the "every branch at its tip" reasoning a few
# lines up). The event-name formula would also disable cancellation for
# ordinary pushes to a live feature branch that has no PR yet — the exact
# stale-run pileup this concurrency block exists to prevent, just on a
# different trigger. What actually needs to stop being constant is `main`
# specifically, so the predicate is keyed on the ref itself: false only for
# `refs/heads/main`, true for every other ref a `push` or `pull_request`
# event can produce (a feature branch tip, or `refs/pull/<N>/merge`).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  # #3036: two distinct main commits must never share a concurrency group.
  # When they do, GitHub keeps only the most recent PENDING run in the group
  # and cancels the earlier one — so on a deep queue every merge silently
  # evicts its predecessor's main run before it ever executes. Measured
  # 2026-09-01: 89 cancelled push-to-main runs in one day, each ending at the
  # exact second its successor was created. The required context still fires
  # on main; it just never produces a verdict, which is worse than not being
  # required at all.
  # Keying the group on the SHA for main pushes gives every commit its own
  # group. PR branches are unaffected — they keep the shared group and the
  # cancellation that saves the queue, which is what the group was added for.
  # format() so every non-main-push event keeps a BYTE-IDENTICAL group to
  # before this change — a '-shared' suffix would have silently orphaned
  # in-flight PR runs from the group their peers join.
  group: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('{0}-{1}-{2}', github.workflow, github.ref, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  # Exempt only main PUSHES from cancellation. A workflow_dispatch on main
  # shares one group, so without this clause two manual runs would race to
  # write the same required context — which unconditional cancellation
  # previously prevented.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  detect-secrets:
    name: detect-secrets baseline audit (${{ github.event_name == 'pull_request' && 'merge tree' || 'branch tip' }})
    # CT102 self-hosted (2026-08-30): PR-blocking guards must stay REAL when
    # hosted minutes are exhausted (zero-step billing failures otherwise).
    # setup-python ships its own pip, so the pinned installs below work
    # unchanged on the self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SECRET_SCAN_SCOPE: ${{ github.event_name == 'pull_request' && format('PR merge tree (head={0}, base={1}, merge={2})', github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.sha) || format('branch tip ({0})', github.sha) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # #3005: without this, a rerun of this REQUIRED check re-attests a merge
      # tree computed against a main that has since moved.
      - name: Merge-ref freshness guard (#3005)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-ref-freshness

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        # `python3 -m pip`, not bare `pip`: setup-python's tarball on the
        # self-hosted runner ships the pip module but no `pip` shim on PATH
        # (first live run failed with exit 127 `pip: command not found`).
        run: python3 -m pip install detect-secrets==1.5.0

      - name: Verify vendored Wycheproof corpus integrity
        run: |
          # The four upstream vector files are excluded from the scan below.
          # That exclusion is only safe while this gate holds: it pins their
          # SHA-256 and rejects any unexpected file in the vendor directory, so
          # the exclusion cannot become a hiding place. Runs BEFORE the scan so
          # a tampered corpus fails fast.
          python3 scripts/check_wycheproof_vendor.py --self-test
          python3 scripts/check_wycheproof_vendor.py

      - name: Verify determinism fixture shape
        run: |
          # tests/integration/fixtures/determinism/expected_roots.json is also
          # excluded from the scan below: it is regenerated wholesale on every
          # state-root material change (REGENERATE_DETERMINISM_FIXTURE=1), and
          # every regeneration rewrites all ten hex values, which detect-secrets
          # fingerprints as ten brand-new findings no baseline entry can match.
          # Three prior regenerations already left 30 stale, unmatchable
          # entries in .secrets.baseline before this exclusion existed — a
          # one-off baseline update fixes exactly one regeneration and reds
          # again on the next. Unlike the Wycheproof corpus this file is
          # SUPPOSED to change, so it cannot be byte-pinned; this gate pins the
          # SHAPE instead (JSON object, integer keys, 64-char lowercase hex
          # values) so the exclusion cannot become a hiding place for
          # something that isn't a state root. Runs BEFORE the scan so a
          # malformed or tampered fixture fails fast.
          python3 scripts/check_determinism_fixture_shape.py --self-test
          python3 scripts/check_determinism_fixture_shape.py

      - name: Scan for new secrets
        run: |
          echo "::notice::secret-scan scope: ${SECRET_SCAN_SCOPE}"

          # Canonical exclusion set. This array is the single source of truth:
          # it is passed to the scan AND rendered into the regeneration
          # instructions printed on failure, so the two cannot drift apart.
          # HERMETIC FLAGS — the whole point of #2292.
          #
          # Without --no-verify, `detect-secrets scan` (the CLI, unlike the
          # library's default_settings()) registers
          #   detect_secrets.filters.common.is_ignored_due_to_verification_policies
          # which issues a LIVE NETWORK REQUEST to each candidate Slack webhook.
          # Templated webhooks get a definitive negative from Slack, are marked
          # VERIFIED_FALSE, and are dropped from the output — so the gate's
          # result became a function of Slack's availability rather than of
          # repository content. Measured on the three templated webhooks in
          # .taskmaster/docs/infrastructure-hardening/ids-ips-configuration.md:
          #
          #                        network up   network blocked
          #   plain scan                    0                 3
          #   scan --no-verify              3                 3
          #
          # That is how #2242's dropped acknowledgements passed two green
          # badges while a reviewer running the same pinned scanner locally saw
          # all three.
          #
          # Enforced by the SENTINEL CHECK in the python step below, which runs
          # on every invocation of this workflow. (An earlier revision of this
          # comment claimed the flag was "guarded by
          # scripts/test_secret_scan_hermetic.py" — that script existed but
          # nothing executed it, so the claim was prose, not a mechanism. #2315.)
          HERMETIC=(--no-verify)

          EXCLUDES=(
            --exclude-files '\.secrets\.baseline$'
            --exclude-files '\.git/'
            --exclude-files 'target/'
            --exclude-files 'node_modules/'
            --exclude-files '\.lock$'
            --exclude-files 'Cargo\.lock$'
            --exclude-files 'package-lock\.json$'
            # Vendored third-party test vectors: thousands of high-entropy hex
            # strings by design. Named individually rather than by directory so
            # a new file dropped alongside them is still scanned; their bytes
            # are pinned by the integrity gate in the step above.
            --exclude-files 'shared-protocol/tests/fixtures/wycheproof/upstream/ed25519_test\.json$'
            --exclude-files 'shared-protocol/tests/fixtures/wycheproof/upstream/ecdsa_secp256k1_sha256_test\.json$'
            --exclude-files 'shared-protocol/tests/fixtures/wycheproof/upstream/ecdsa_secp256k1_sha3_256_test\.json$'
            --exclude-files 'shared-protocol/tests/fixtures/wycheproof/upstream/ecdsa_secp256r1_sha256_p1363_test\.json$'
            # Determinism golden fixture: regenerated wholesale on every
            # state-root material change, so every entry's hash fingerprint
            # changes too — a baseline entry can only ever match one
            # regeneration. Shape-pinned instead of byte-pinned by the
            # integrity gate in the step above (secret-scanning#2885).
            #
            # Anchored to the repo-relative path (^...) rather than a bare
            # suffix match: this scanner version applies --exclude-files with
            # regex.search, not a full-path match, so an unanchored pattern
            # here also matches any nested/suffix-collision path ending the
            # same way (e.g. shadow/tests/integration/fixtures/determinism/
            # expected_roots.json) and silently drops it from scanning too.
            # Reproduced and regression-tested in
            # scripts/test_secret_scan_exclude_anchoring.py (core4#2886).
            --exclude-files '^tests/integration/fixtures/determinism/expected_roots\.json$'
          )

          # Per-job scratch directory. These three files used to live at fixed
          # /tmp paths, which the CT102 runners share: two scans overlapping in
          # time wrote the same current-scan.json and the audit died with
          # `json.decoder.JSONDecodeError: Extra data` (core4#3472 merge-tree
          # job 111409987587). mktemp -d is unique per job; the trap removes it.
          SCAN_DIR="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/secret-scan.XXXXXX")"
          export SCAN_DIR
          trap 'rm -rf "$SCAN_DIR"' EXIT

          detect-secrets scan "${HERMETIC[@]}" "${EXCLUDES[@]}" > "$SCAN_DIR/current-scan.json"

          # Render the exact same flags and list for the failure help text, so
          # a developer regenerating the baseline uses the SAME scan the gate
          # used. Without this the printed command would omit --no-verify, they
          # would produce a baseline missing the templated webhooks, and the
          # gate would then reject their own regeneration.
          printf '%s\n' "${HERMETIC[@]}" > "$SCAN_DIR/scanflags.txt"
          printf '%s\n' "${EXCLUDES[@]}" > "$SCAN_DIR/excludes.txt"

          python3 << 'EOF'
          import json, os, sys

          with open('.secrets.baseline') as f:
              baseline = json.load(f)
          with open(os.path.join(os.environ['SCAN_DIR'], 'current-scan.json')) as f:
              current = json.load(f)

          # ---------------------------------------------------------------
          # SENTINEL CHECK — must run BEFORE the difference below (#2315).
          #
          # The `current - acknowledged` comparison cannot detect the defect
          # this gate was hardened against. If --no-verify is ever dropped,
          # detect-secrets silently omits the templated Slack webhooks: they
          # disappear from `current` while remaining in the baseline, so the
          # ONE-WAY difference stays empty and the gate exits green having
          # scanned strictly less. Measured with verification re-enabled:
          # baseline 2457, current 2454, unacknowledged 0.
          #
          # A positive assertion is therefore required, not merely desirable.
          # Cost is a set difference over a JSON file already produced above —
          # no second scan — which matters because this workflow runs on every
          # push to every branch.
          # ---------------------------------------------------------------
          # Python, not JSON: a 40-char hex string is itself a Hex High Entropy
          # String finding, and JSON has no comment syntax to carry
          # `pragma: allowlist secret`. A JSON sentinel file failed this very
          # gate — caught by running the gate against its own change (#2315).
          sys.path.insert(0, 'scripts')
          import secret_scan_sentinels as sentinels

          expected = set(sentinels.HASHED_SECRETS)
          if not expected:
              print('::error::sentinel list is empty — the presence check would '
                    'pass vacuously, which is the bug it exists to prevent')
              sys.exit(1)

          # The fixture is generated at run time (never committed, so push
          # protection and the baseline never see it) and scanned with the SAME
          # flags as the main scan, read back from scanflags.txt.
          with open(os.path.join(os.environ['SCAN_DIR'], 'scanflags.txt')) as f:
              scan_flags = f.read().split()
          absent = sentinels.absent_sentinels(scan_flags)
          if absent:
              print(f'::error::secret scan is NOT hermetic: {len(absent)} sentinel '
                    f'finding(s) missing from the scan output')
              for h in absent:
                  print(f'  {h}  (expected from {sentinels.SENTINEL_PATH})')
              print()
              print('These are templated Slack webhooks that detect-secrets drops when '
                    'the verification filter is active — it makes a live network request '
                    'to each candidate webhook and discards the ones Slack rejects.')
              print('The scan must pass --no-verify (see HERMETIC above). Without it this '
                    'gate scans less and still reports green, because the missing findings '
                    'vanish from BOTH sides of the comparison below.')
              sys.exit(1)

          print(f'sentinels: all {len(expected)} present — scan is hermetic')

          # Build set of all (path, hashed_secret, type) tuples already in the baseline
          acknowledged = {
              (path, finding['hashed_secret'], finding['type'])
              for path, findings in baseline.get('results', {}).items()
              for finding in findings
          }

          # Find any new findings not in the baseline
          new_findings = []
          for path, findings in current.get('results', {}).items():
              for finding in findings:
                  key = (path, finding['hashed_secret'], finding['type'])
                  if key not in acknowledged:
                      new_findings.append(
                          f"  {path}:{finding.get('line_number', '?')} [{finding['type']}]"
                      )

          if new_findings:
              count = len(new_findings)
              print(f"::error::[{os.environ['SECRET_SCAN_SCOPE']}] detect-secrets found {count} unacknowledged secret(s):")
              for item in new_findings[:20]:
                  print(item)
              if count > 20:
                  print(f"  ... and {count - 20} more")
              print()
              print("To acknowledge false positives, regenerate the baseline:")
              # Rendered from the same array the scan used, so these
              # instructions cannot drift from the gate that enforces them.
              with open(os.path.join(os.environ['SCAN_DIR'], 'excludes.txt')) as f:
                  tokens = [line.rstrip('\n') for line in f if line.strip()
                            and not line.lstrip().startswith('#')]
              with open(os.path.join(os.environ['SCAN_DIR'], 'scanflags.txt')) as f:
                  flags = [line.strip() for line in f if line.strip()]
              print("  detect-secrets scan " + " ".join(flags) + " \\")
              for flag, pattern in zip(tokens[::2], tokens[1::2]):
                  print(f"    {flag} '{pattern}' \\")
              print("    > .secrets.baseline")
              print("Then audit and commit the updated .secrets.baseline.")
              sys.exit(1)
          else:
              baseline_count = sum(len(v) for v in baseline.get('results', {}).values())
              print(f"[{os.environ['SECRET_SCAN_SCOPE']}] detect-secrets: OK — no new secrets beyond baseline ({baseline_count} acknowledged finding(s))")
          EOF

  secret-leak-scan:
    # STATIC name, on purpose (#2981 / merge-admission epic story 5). A job that
    # is skipped by its `if:` never has its `name:` template evaluated, so the
    # old `(${{ event == pull_request && 'merge tree' || 'branch tip' }})` suffix
    # rendered LITERALLY — `(${{ (((github.event_name == 'pull_request') && ...`
    # — on every branch push, and a skipped-by-design job was indistinguishable
    # from a broken one (it cost a false finding on #2981). The job only ever
    # RUNS on pull_request, so the only tree it can examine is the merge tree;
    # the name says that, and says the push-skip is deliberate. Contrast the
    # `detect-secrets` job above: its name template is kept because that job
    # runs on both events (so it always expands) and its `(merge tree)` form is
    # a REQUIRED context in ruleset 19875840 — renaming it would break admission.
    name: secret-leak static + runtime passes (#2129) (merge tree; skipped on push by design)
    # Hosted minutes remain parked on push; branch-tip coverage is provided by
    # the zero-cost self-hosted `detect-secrets` job above (#2887).
    if: github.event_name == 'pull_request'
    # CT102 self-hosted (2026-09-24, owner decision): this is the ONLY job that
    # runs check_secret_leak.py. On ubuntu-latest it ran 0 steps (VOID) once
    # hosted minutes were exhausted, and 45 findings accumulated on main unseen
    # (#3282). Same move as the detect-secrets audit above (#2921 decision 2).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SECRET_SCAN_SCOPE: ${{ github.event_name == 'pull_request' && format('PR merge tree (head={0}, base={1}, merge={2})', github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.sha) || format('branch tip ({0})', github.sha) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Refs #3621: reclaim hosted disk before cache restore or compilation.
      - name: Free unused preinstalled toolchains (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null
          echo "after:"; df -h /
          echo "WRFCOIN_HEAVY_BUILD_MIN_FREE_GIB=10" >> "$GITHUB_ENV"
          python3 -c "import shutil; print(f'free for the heavy-build guard: {shutil.disk_usage(\".\").free / 1024**3:.1f} GiB (hosted floor 10)')"

      # #3005: same guard as the detect-secrets leg — one shared action, so the
      # two cannot drift apart.
      - name: Merge-ref freshness guard (#3005)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/merge-ref-freshness

      - name: Explain scan scope
        run: |
          echo "::notice::secret-scan scope: ${SECRET_SCAN_SCOPE}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Self-test FIRST: a scanner nobody tests proves nothing. Review of #2239
      # found a one-line planted leak was caught while the identical multiline
      # form passed, and a planted bail!() passed because error macros were not
      # sinks. These fixtures plant a leak on every claimed surface and require
      # each to be rejected.
      - name: Scanner self-test — every planted surface must be rejected
        run: python3 scripts/test_check_secret_leak.py

      # Static pass over ALL production Rust roots. The previous version
      # defaulted to three crates and the job passed no paths, so it reported
      # clean over a partial tree that omitted native-chain. Omitted roots are
      # printed on every run. Policy: docs/security/SECRET_HANDLING.md
      - name: Static pass — no secrets in logs/metrics/errors/panics
        run: python3 scripts/check_secret_leak.py

      # Companion scanner from #2128: secret material copied into an owned
      # String/Vec, a Serialize impl, or a derived Debug.
      - name: Static pass — no secret copies into leak-prone forms
        run: |
          if [ -f scripts/check_secret_copies.py ]; then
            python3 scripts/check_secret_copies.py
          else
            echo "check_secret_copies.py not present on this ref (lands with #2128) — skipping"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'

      # CT102 data cap (infra#1113, core4#2955): skip the GitHub cache on
      # self-hosted runners. CT102's per-runner CARGO_HOME, RUSTUP_HOME and
      # CARGO_TARGET_DIR (/build/*-<runner>) persist between jobs, so this restore
      # re-downloaded 127-384 MB per job over a metered line for nothing. Hosted
      # runners keep the cache.
      - name: Cache cargo
        if: runner.environment != 'self-hosted'
        uses: Swatinem/rust-cache@v2

      # Runtime pass: a static scan cannot see through a Display impl that
      # derives its output from a secret field. Sentinel values can.
      - name: Runtime pass — sentinel must not appear in any output path
        run: cargo test --locked -p wrfcoin-shared-protocol --test no_secret_in_output

  # core4#2912 — the single required-check name for this workflow.
  #
  # Stable and event-independent BY CONSTRUCTION: no `${{ }}` anywhere in the
  # `name:`. The two jobs above template their names on `github.event_name`, so
  # each registers under a different context per event — and a skipped job never
  # evaluates its name expression at all, registering the literal template
  # string. Required checks match by name, so neither of them can be required
  # safely. This one can.
  #
  # `if: always()` so it runs even when a dependency failed, was cancelled, or
  # was skipped. Without it, the summary would itself be skipped and inherit the
  # exact hazard it exists to close.
  secret-scanning-summary:
    name: Secret Scanning summary
    needs: [detect-secrets, secret-leak-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # core4#2914 contract: the verdict is the shared assert_gate_results.py,
      # classified per event from scripts/terminal_skip_guard_manifest.json.
      # Registering here rather than exempting is the point — an entry that
      # excused this job would defeat the guard it is registering with.
      #
      # push: secret-leak-scan is hosted and PR-guarded, so `skipped` is the
      #   expected, ASSERTED outcome — not a default.
      # default (pull_request, and any event not enumerated): both required.
      #   An unenumerated event therefore inherits the STRICTER set.
      - name: Evaluate dependency results for this event
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
          GATE_REQUIRED: ${{ github.event_name == 'push' && 'detect-secrets' || 'detect-secrets secret-leak-scan' }}
          GATE_CONDITIONAL: ${{ github.event_name == 'push' && 'secret-leak-scan' || '' }}
        run: python3 scripts/assert_gate_results.py
